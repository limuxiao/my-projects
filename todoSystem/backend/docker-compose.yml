# 后端独立部署：NestJS 服务
# 数据库和 Redis 使用外部服务，连接配置来自同目录的 .env.prd
# 用法：
#   docker compose --env-file .env.prd up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todosystem-backend
    restart: unless-stopped
    # 注入 .env.prd 中的 DB/Redis/JWT 等配置
    env_file:
      - ./.env.prd
    ports:
      # 端口与 .env.prd 中的 PORT 保持一致，默认 3099
      - "${PORT:-3099}:${PORT:-3099}"
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:${PORT:-3099}/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  backend_logs:
