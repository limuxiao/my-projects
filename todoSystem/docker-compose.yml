# TodoSystem 部署编排：MySQL + Redis + NestJS 后端 + React/nginx 前端
# 用法：
#   cp .env.deploy.example .env.deploy    # 修改其中的密码与密钥
#   docker compose --env-file .env.deploy up -d --build

services:
  mysql:
    image: mysql:8.0
    container_name: todosystem-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.deploy 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-todosystem}
      MYSQL_USER: ${DB_USER:-todosystem}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env.deploy 设置 DB_PASSWORD}
    ports:
      # 仅宿主机需要直连数据库时暴露；生产可改成 127.0.0.1:3307:3306
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # MySQL 容器首次初始化时按文件名字母序执行：先建表，再导课程数据
      - ./doc/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./doc/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    healthcheck:
      # 只用 mysqladmin ping，不做 SELECT（初始化期间查表会失败）
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: todosystem-redis
    restart: unless-stopped
    # 容器内 Redis 不设密码，仅对内部网络开放；如需密码用 command 加 --requirepass 并同步后端 REDIS_PASSWORD
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todosystem-backend
    restart: unless-stopped
    # 直接把配置注入进程环境；ConfigModule 读 process.env，优先级高于 .env 文件
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-todosystem}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env.deploy 设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-todosystem}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET:?请在 .env.deploy 设置 JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 日志落盘到宿主机，容器重建不丢
      - backend_logs:/app/logs
    healthcheck:
      # 用 node 自带能力请求健康检查接口，不依赖 curl/wget
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todosystem-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8001}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  backend_logs:
