server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端是 SPA（React Router history 模式），刷新 /study/day/1 这类地址时
    # 磁盘上并没有对应文件，统一回退到 index.html 交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理：浏览器访问 /api/xxx 由 nginx 转发到后端容器
    # 这样前后端同源，不需要浏览器跨域（CORS）
    # backend 是 docker-compose 里的服务名，容器内 DNS 可解析
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / WebSocket 升级头（若将来接入实时功能可直接使用）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 静态资源缓存：带 hash 的文件名可长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 隐藏 nginx 版本号
    server_tokens off;
}
